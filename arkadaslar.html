<!DOCTYPE html>
<html lang="tr" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arkadaşlar · Bay Porsuk</title>

  <!-- Poppins yazı tipi -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Font Awesome 6 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />

  <!-- Proje stilleri -->
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="admin.css" />
  <link rel="stylesheet" href="arkadaslar.css" />

  <!-- Yetki kontrolü -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="sb.js"></script>
  <script src="script.js"></script>
  <script>
    /* Oturum kontrolü hazır kapısında yapılır: Supabase oturumu
       asenkron geldiği için sayfa çizilir çizilmez bakılamaz.
       Karar verilene kadar sayfa gizli tutulur ki yetkisiz kullanıcı
       içeriği bir an bile görmesin. */
    document.documentElement.style.visibility = "hidden";
    window.YKS.hazir(function () {
      if (!window.YKS.Auth.isLoggedIn()) {
        window.location.replace("index.html");
        return;
      }
      document.documentElement.style.visibility = "";
    });
  </script>
</head>

<body>
  <canvas id="particle-canvas" aria-hidden="true"></canvas>

  <div class="friends-page">
    <div class="friends-container">

      <!-- ================================================
           ÜST BAR
           ================================================ -->
      <div class="friends-header glass">
        <button type="button" class="btn-x btn-ghost-x" id="back-btn">
          <i class="fa-solid fa-arrow-left"></i> Geri Dön
        </button>

        <div class="header-title">
          <i class="fa-solid fa-user-group"></i>
          <div>
            <h1>Arkadaşlar</h1>
            <span class="header-sub" id="header-sub">Kişi bul, istek gönder, sohbete başla.</span>
          </div>
        </div>

        <div class="header-side">
          <a class="msg-chip" href="mesajlar.html" id="unread-chip" title="Mesajlara git">
            <i class="fa-solid fa-comments"></i> <b>0</b>
          </a>
          <button type="button" class="btn-x btn-primary-x" id="discover-btn">
            <i class="fa-solid fa-user-plus"></i> Kişi Bul
          </button>
        </div>
      </div>

      <!-- ================================================
           SEKMELER
           ================================================ -->
      <div class="friend-tabs glass">
        <button type="button" class="friend-tab active" data-tab="friends">
          <i class="fa-solid fa-user-group"></i>
          <span>Arkadaşlarım</span>
          <span class="tab-count" data-count="friends">0</span>
        </button>
        <button type="button" class="friend-tab" data-tab="incoming">
          <i class="fa-solid fa-inbox"></i>
          <span>Gelen İstekler</span>
          <span class="tab-count" data-count="incoming">0</span>
        </button>
        <button type="button" class="friend-tab" data-tab="outgoing">
          <i class="fa-solid fa-paper-plane"></i>
          <span>Gönderilenler</span>
          <span class="tab-count" data-count="outgoing">0</span>
        </button>
        <button type="button" class="friend-tab" data-tab="discover">
          <i class="fa-solid fa-compass"></i>
          <span>Kişi Bul</span>
          <span class="tab-count" data-count="discover">0</span>
        </button>
      </div>

      <!-- ================================================
           ARAÇ ÇUBUĞU
           ================================================ -->
      <div class="friends-toolbar glass">
        <div class="input-icon toolbar-search">
          <input class="input" type="search" id="friend-search"
                 placeholder="İsim veya kullanıcı adı ara" />
          <i class="fa-solid fa-magnifying-glass"></i>
        </div>

        <select class="select toolbar-select" id="field-filter" aria-label="Alan süzgeci">
          <option value="">Tüm alanlar</option>
          <option value="sayisal">Sayısal</option>
          <option value="esit-agirlik">Eşit Ağırlık</option>
          <option value="sozel">Sözel</option>
        </select>

        <span class="toolbar-count" id="result-label">—</span>
      </div>

      <!-- ================================================
           LİSTE
           ================================================ -->
      <div class="people-grid" id="people-grid"></div>

    </div>
  </div>

  <!-- ================================================
       ARKADAŞLIKTAN ÇIKARMA ONAYI
       ================================================ -->
  <div class="modal fade" id="unfriend-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title">
            <i class="fa-solid fa-user-minus"></i> Arkadaşlıktan çıkar
          </h5>
        </div>
        <div class="modal-body">
          <p class="muted mb-2">
            Bu kişi arkadaş listenden çıkacak ve birbirinize mesaj gönderemeyeceksiniz.
            Eski yazışmalar silinmez.
          </p>
          <p class="delete-target mb-0" id="unfriend-name">—</p>
        </div>
        <div class="modal-footer border-0">
          <button type="button" class="btn-x btn-ghost-x" data-bs-dismiss="modal">Vazgeç</button>
          <button type="button" class="btn-x btn-danger-x" id="confirm-unfriend-btn">
            <i class="fa-solid fa-user-minus"></i> Çıkar
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bildirim alanı -->
  <div id="toast-area"></div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Arkadaşlar JS -->
  <script src="arkadaslar.js"></script>
</body>
</html>
