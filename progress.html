<!DOCTYPE html>
<html lang="tr" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ders Başarı Takip · Bay Porsuk</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="admin.css" />
  <!-- Sekme çubuğu ve üst bar bileşenleri iki modülde ortak -->
  <link rel="stylesheet" href="exams.css" />
  <link rel="stylesheet" href="progress.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="sb.js"></script>
  <script src="script.js"></script>
  <script>
    /* Oturum kontrolü hazır kapısında yapılır: Supabase oturumu
       asenkron geldiği için sayfa çizilir çizilmez bakılamaz.
       Karar verilene kadar sayfa gizli tutulur ki yetkisiz kullanıcı
       içeriği bir an bile görmesin. */
    document.documentElement.style.visibility = "hidden";
    window.YKS.hazir(function () {
      if (!window.YKS.Auth.isLoggedIn()) {
        window.location.replace("index.html");
        return;
      }
      document.documentElement.style.visibility = "";
    });
  </script>
</head>

<body>
  <canvas id="particle-canvas" aria-hidden="true"></canvas>

  <div class="progress-page">
    <div class="progress-container">
      
      <!-- Üst Bar -->
      <div class="progress-header glass">
        <button type="button" class="btn-x btn-ghost-x" id="back-btn">
          <i class="fa-solid fa-arrow-left"></i> Geri Dön
        </button>
        <div class="header-title">
          <i class="fa-solid fa-chart-line"></i>
          <h1>Ders Başarı Takip</h1>
        </div>
        <a href="exams.html" class="btn-x btn-primary-x">
          <i class="fa-solid fa-clipboard-list"></i> Denemeler
        </a>
      </div>

      <!-- Deneme Tipi Seçimi -->
      <div class="exam-tabs glass">
        <button type="button" class="exam-tab active" data-type="tyt">
          <i class="fa-solid fa-book"></i>
          <span>TYT</span>
          <span class="tab-count" id="tyt-count">0</span>
        </button>
        <button type="button" class="exam-tab" data-type="ayt">
          <i class="fa-solid fa-graduation-cap"></i>
          <span>AYT</span>
          <span class="tab-count" id="ayt-count">0</span>
        </button>
        <button type="button" class="exam-tab" data-type="kpss">
          <i class="fa-solid fa-briefcase"></i>
          <span>KPSS</span>
          <span class="tab-count" id="kpss-count">0</span>
        </button>
      </div>

      <!-- Aralık ve sıralama -->
      <div class="progress-toolbar glass">
        <div class="toolbar-group">
          <label for="range-select">Aralık</label>
          <select class="select" id="range-select">
            <option value="all">Tüm denemeler</option>
            <option value="10">Son 10 deneme</option>
            <option value="5">Son 5 deneme</option>
          </select>
        </div>

        <div class="toolbar-group">
          <label for="sort-select">Sıralama</label>
          <select class="select" id="sort-select">
            <option value="default">Ders sırası</option>
            <option value="improvement">Gelişim: çoktan aza</option>
            <option value="average">Ortalama: yüksekten düşüğe</option>
          </select>
        </div>

        <a href="exams.html" class="btn-x btn-ghost-x toolbar-link">
          <i class="fa-solid fa-plus"></i> Deneme ekle
        </a>
      </div>

      <!-- İçerik -->
      <div id="progress-content"></div>

    </div>
  </div>

  <!-- Bildirim alanı -->
  <div id="toast-area"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="progress.js"></script>
</body>
</html>
