<!DOCTYPE html>
<html lang="tr" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Baykuş Social · Bay Porsuk</title>
  <meta name="description" content="Bay Porsuk sosyal akışı — gönderi paylaş, beğen, yorumla." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="admin.css" />
  <!-- Üst bar, boş durum ve başlık stilleri modül sayfalarında ortak -->
  <link rel="stylesheet" href="exams.css" />
  <link rel="stylesheet" href="sosyal.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="sb.js"></script>
  <script src="script.js"></script>
  <!-- Rozet paylaşımı için: motoru kurar, bu sayfada çizim yapmaz -->
  <script src="konular.js"></script>
  <script src="rozetler.js"></script>
  <script>
    /* Oturum kontrolü hazır kapısında yapılır: Supabase oturumu
       asenkron geldiği için sayfa çizilir çizilmez bakılamaz.
       Karar verilene kadar sayfa gizli tutulur ki yetkisiz kullanıcı
       içeriği bir an bile görmesin. */
    document.documentElement.style.visibility = "hidden";
    window.YKS.hazir(function () {
      if (!window.YKS.Auth.isLoggedIn()) {
        window.location.replace("index.html");
        return;
      }
      document.documentElement.style.visibility = "";
    });
  </script>
</head>

<body>
  <canvas id="particle-canvas" aria-hidden="true"></canvas>

  <div class="sosyal-page">
    <div class="sosyal-container">

      <!-- ================================================
           ÜST BAR
           ================================================ -->
      <div class="sosyal-header glass">
        <button type="button" class="btn-x btn-ghost-x" id="back-btn">
          <i class="fa-solid fa-arrow-left"></i> Geri Dön
        </button>

        <div class="header-title">
          <i class="fa-solid fa-feather-pointed"></i>
          <h1>Baykuş Social</h1>
        </div>

        <a class="btn-x btn-ghost-x" href="arkadaslar.html">
          <i class="fa-solid fa-user-group"></i> Arkadaşlar
        </a>
      </div>

      <!-- ================================================
           ÖZET ŞERİDİ
           ================================================ -->
      <div class="sosyal-stats" id="sosyal-stats"></div>

      <!-- ================================================
           YAZMA KUTUSU
           ================================================ -->
      <div class="composer glass" id="composer">
        <div class="composer-row">
          <img class="composer-avatar" id="composer-avatar" alt="Profil fotoğrafın" />

          <div class="composer-field">
            <textarea class="composer-text" id="composer-text"
                      placeholder="Bugün ne çalıştın? Bir rozetini göster, bir netini paylaş…"></textarea>

            <!-- Seçilen görselin önizlemesi -->
            <div class="composer-preview" id="composer-preview">
              <img src="" alt="Seçilen görsel önizlemesi" />
              <span class="preview-size"></span>
              <button type="button" class="preview-clear" id="composer-image-clear"
                      title="Görseli kaldır" aria-label="Görseli kaldır">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>

            <!-- Kimin görebileceğini yazar seçer -->
            <div class="vis-row">
              <span class="vis-label"><i class="fa-solid fa-eye"></i> Kimler görsün?</span>
              <div class="vis-picker" id="composer-visibility" role="radiogroup"
                   aria-label="Gönderiyi kimler görsün">
                <button type="button" class="vis-opt active" data-vis="public"
                        role="radio" aria-checked="true">
                  <i class="fa-solid fa-globe"></i> Herkes
                </button>
                <button type="button" class="vis-opt" data-vis="friends"
                        role="radio" aria-checked="false">
                  <i class="fa-solid fa-user-group"></i> Arkadaşlarım
                </button>
              </div>
              <span class="vis-hint" id="composer-vis-hint">Akıştaki herkes görebilir.</span>
            </div>

            <div class="composer-foot">
              <div class="composer-tools" id="composer-tools">
                <label class="composer-tool">
                  <i class="fa-solid fa-image"></i> Görsel
                  <input type="file" id="composer-image" accept="image/*" />
                </label>

                <button type="button" class="composer-tool" id="composer-badge">
                  <i class="fa-solid fa-award"></i> Rozet paylaş
                </button>
              </div>

              <span class="composer-count" id="composer-count">0 / 500</span>

              <button type="button" class="btn-x btn-ghost-x" id="composer-cancel"
                      style="display:none">
                <i class="fa-solid fa-xmark"></i> Vazgeç
              </button>

              <button type="button" class="btn-x btn-primary-x" id="composer-submit">
                <i class="fa-solid fa-paper-plane"></i> Paylaş
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- ================================================
           SÜZGEÇ ÇUBUĞU
           ================================================ -->
      <div class="sosyal-toolbar glass">
        <div class="scope-tabs">
          <button type="button" class="scope-tab active" data-scope="all">
            <i class="fa-solid fa-globe"></i> Tümü
          </button>
          <button type="button" class="scope-tab" data-scope="friends">
            <i class="fa-solid fa-user-group"></i> Arkadaşlarım
          </button>
        </div>

        <div class="input-icon toolbar-search">
          <input class="input" type="search" id="sosyal-search"
                 placeholder="Gönderi veya kişi ara" />
          <i class="fa-solid fa-magnifying-glass"></i>
        </div>

        <span class="toolbar-count" id="sosyal-count">—</span>
      </div>

      <!-- ================================================
           AKIŞ
           ================================================ -->
      <div class="sosyal-feed" id="sosyal-feed"></div>

    </div>
  </div>

  <!-- ================================================
       ROZET SEÇİCİ
       ================================================ -->
  <div class="modal fade" id="badge-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="fa-solid fa-award"></i> Rozetini paylaş</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button>
        </div>
        <div class="modal-body">
          <p class="faint mb-3">Bir rozet seç, metin kutusuna eklensin.</p>
          <div class="badge-picker-list" id="badge-picker-list"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ================================================
       SİLME ONAYI
       ================================================ -->
  <div class="modal fade" id="delete-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title">
            <i class="fa-solid fa-triangle-exclamation"></i> Gönderiyi sil
          </h5>
        </div>
        <div class="modal-body">
          <p class="muted mb-2">Bu gönderi, beğenileri ve yorumlarıyla birlikte kalıcı olarak silinecek.</p>
          <p class="delete-target mb-0" id="delete-post-preview">—</p>
        </div>
        <div class="modal-footer border-0">
          <button type="button" class="btn-x btn-ghost-x" data-bs-dismiss="modal">Vazgeç</button>
          <button type="button" class="btn-x btn-danger-x" id="delete-ok">
            <i class="fa-solid fa-trash"></i> Sil
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-area"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="sosyal.js"></script>
</body>
</html>
