<!DOCTYPE html>
<html lang="tr" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ders Takibi · Bay Porsuk</title>

  <!-- Poppins yazı tipi -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Font Awesome 6 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />

  <!-- Proje stilleri -->
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="admin.css" />
  <link rel="stylesheet" href="exams.css" />
  <link rel="stylesheet" href="dersler.css" />

  <!-- Çekirdek + müfredat kataloğu -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="sb.js"></script>
  <script src="script.js"></script>
  <script src="konular.js"></script>
  <script>
    /* Oturum kontrolü hazır kapısında yapılır: Supabase oturumu
       asenkron geldiği için sayfa çizilir çizilmez bakılamaz.
       Karar verilene kadar sayfa gizli tutulur ki yetkisiz kullanıcı
       içeriği bir an bile görmesin. */
    document.documentElement.style.visibility = "hidden";
    window.YKS.hazir(function () {
      if (!window.YKS.Auth.isLoggedIn()) {
        window.location.replace("index.html");
        return;
      }
      document.documentElement.style.visibility = "";
    });
  </script>
</head>

<body>
  <canvas id="particle-canvas" aria-hidden="true"></canvas>

  <div class="topics-page">
    <div class="topics-container">

      <!-- ================================================
           ÜST BAR
           ================================================ -->
      <div class="topics-header glass">
        <button type="button" class="btn-x btn-ghost-x" id="back-btn">
          <i class="fa-solid fa-arrow-left"></i> Geri Dön
        </button>

        <div class="header-title">
          <i class="fa-solid fa-book-open"></i>
          <div>
            <h1>Ders Takibi</h1>
            <span class="header-sub" id="header-sub">Konu konu ilerlemeni işaretle.</span>
          </div>
        </div>

        <div class="header-side">
          <span class="hours-chip" id="hours-chip" title="Bu sınav türünde kaydettiğin toplam çalışma">
            <i class="fa-solid fa-hourglass-half"></i> <b>0 dk</b>
          </span>
          <button type="button" class="btn-x btn-ghost-x" id="toggle-all-btn">
            <i class="fa-solid fa-chevron-down"></i> Tümünü aç
          </button>
        </div>
      </div>

      <!-- ================================================
           SINAV TÜRÜ SEKMELERİ
           ================================================ -->
      <div class="exam-tabs glass" id="type-tabs">
        <button type="button" class="exam-tab active" data-type="tyt">
          <i class="fa-solid fa-book"></i>
          <span>TYT</span>
          <span class="tab-count" data-count="tyt">0</span>
        </button>
        <button type="button" class="exam-tab" data-type="ayt">
          <i class="fa-solid fa-graduation-cap"></i>
          <span>AYT</span>
          <span class="tab-count" data-count="ayt">0</span>
        </button>
        <button type="button" class="exam-tab" data-type="kpss">
          <i class="fa-solid fa-briefcase"></i>
          <span>KPSS</span>
          <span class="tab-count" data-count="kpss">0</span>
        </button>
      </div>

      <!-- ================================================
           İSTATİSTİK KARTLARI
           ================================================ -->
      <div class="topic-stats" id="topic-stats"></div>

      <!-- ================================================
           ARAÇ ÇUBUĞU
           ================================================ -->
      <div class="topics-toolbar glass">
        <div class="input-icon toolbar-search">
          <input class="input" type="search" id="topic-search"
                 placeholder="Konu, ünite veya ders ara" />
          <i class="fa-solid fa-magnifying-glass"></i>
        </div>

        <select class="select toolbar-select" id="subject-filter" aria-label="Ders süzgeci">
          <option value="">Tüm dersler</option>
        </select>

        <select class="select toolbar-select" id="status-filter" aria-label="Durum süzgeci">
          <option value="">Tüm durumlar</option>
          <option value="none">Başlanmadı</option>
          <option value="learning">Çalışıyorum</option>
          <option value="review">Tekrar gerekli</option>
          <option value="done">Bitti</option>
          <option value="studied">Süre girilmiş olanlar</option>
        </select>

        <span class="toolbar-count" id="result-label">—</span>
      </div>

      <!-- ================================================
           DERS LİSTESİ
           ================================================ -->
      <div class="subjects-wrap" id="subjects-wrap"></div>

    </div>
  </div>

  <!-- ================================================
       KONU DETAY PENCERESİ
       ================================================ -->
  <div class="modal fade" id="topic-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="topic-modal-title">
            <i class="fa-solid fa-book-open"></i> Konu
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button>
        </div>

        <div class="modal-body">
          <p class="topic-path" id="topic-path">—</p>

          <div class="field">
            <label>Durum</label>
            <div class="segmented segmented-4" id="status-picker">
              <button type="button" class="seg-btn none active" data-status="none">
                <i class="fa-regular fa-circle"></i> Başlanmadı
              </button>
              <button type="button" class="seg-btn learning" data-status="learning">
                <i class="fa-solid fa-spinner"></i> Çalışıyorum
              </button>
              <button type="button" class="seg-btn review" data-status="review">
                <i class="fa-solid fa-rotate-right"></i> Tekrar gerekli
              </button>
              <button type="button" class="seg-btn done" data-status="done">
                <i class="fa-solid fa-circle-check"></i> Bitti
              </button>
            </div>
          </div>

          <div class="grid-2">
            <div class="field">
              <label for="topic-hours">Çalışma süresi</label>
              <div class="time-inputs">
                <div class="input-icon">
                  <input class="input" type="number" id="topic-hours" min="0" max="999" step="1" value="0" />
                  <i class="fa-solid fa-hourglass-half"></i>
                </div>
                <span class="time-unit">saat</span>
                <div class="input-icon">
                  <input class="input" type="number" id="topic-minutes" min="0" max="59" step="5" value="0" />
                  <i class="fa-solid fa-clock"></i>
                </div>
                <span class="time-unit">dakika</span>
              </div>
              <div class="quick-add">
                <button type="button" class="quick-btn" data-add="15">+15 dk</button>
                <button type="button" class="quick-btn" data-add="30">+30 dk</button>
                <button type="button" class="quick-btn" data-add="60">+1 saat</button>
                <button type="button" class="quick-btn" data-add="120">+2 saat</button>
              </div>
            </div>

            <div class="field">
              <label for="topic-questions">Çözülen soru</label>
              <div class="input-icon">
                <input class="input" type="number" id="topic-questions" min="0" max="99999" step="1" value="0" />
                <i class="fa-solid fa-list-check"></i>
              </div>
              <div class="quick-add">
                <button type="button" class="quick-btn" data-add-q="10">+10</button>
                <button type="button" class="quick-btn" data-add-q="25">+25</button>
                <button type="button" class="quick-btn" data-add-q="50">+50</button>
              </div>
            </div>
          </div>

          <div class="field mb-0">
            <label for="topic-note">Notlar</label>
            <textarea class="textarea" id="topic-note" rows="5" maxlength="2000"
                      placeholder="Kaynak, eksik kalan yerler, formüller, hata yaptığın soru tipleri..."></textarea>
            <p class="hint mb-0" id="topic-note-count">0/2000</p>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-x btn-danger-x me-auto" id="topic-reset-btn">
            <i class="fa-solid fa-eraser"></i> Kaydı temizle
          </button>
          <button type="button" class="btn-x btn-ghost-x" data-bs-dismiss="modal">Vazgeç</button>
          <button type="button" class="btn-x btn-primary-x" id="topic-save-btn">
            <i class="fa-solid fa-floppy-disk"></i> Kaydet
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bildirim alanı -->
  <div id="toast-area"></div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Ders takibi JS -->
  <script src="dersler.js"></script>
</body>
</html>
