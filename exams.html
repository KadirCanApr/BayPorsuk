<!DOCTYPE html>
<html lang="tr" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deneme Sonuçları · Bay Porsuk</title>

  <!-- Poppins yazı tipi -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Font Awesome 6 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />

  <!-- Proje stilleri -->
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="admin.css" />
  <link rel="stylesheet" href="exams.css" />

  <!-- Yetki kontrolü -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="sb.js"></script>
  <script src="script.js"></script>
  <script>
    /* Oturum kontrolü hazır kapısında yapılır: Supabase oturumu
       asenkron geldiği için sayfa çizilir çizilmez bakılamaz.
       Karar verilene kadar sayfa gizli tutulur ki yetkisiz kullanıcı
       içeriği bir an bile görmesin. */
    document.documentElement.style.visibility = "hidden";
    window.YKS.hazir(function () {
      if (!window.YKS.Auth.isLoggedIn()) {
        window.location.replace("index.html");
        return;
      }
      document.documentElement.style.visibility = "";
    });
  </script>
</head>

<body>
  <canvas id="particle-canvas" aria-hidden="true"></canvas>

  <div class="exams-page">
    <div class="exams-container">
      
      <!-- Üst Bar -->
      <div class="exams-header glass">
        <button type="button" class="btn-x btn-ghost-x" id="back-btn">
          <i class="fa-solid fa-arrow-left"></i> Geri Dön
        </button>
        <div class="header-title">
          <i class="fa-solid fa-clipboard-list"></i>
          <h1>Deneme Sonuçları</h1>
        </div>
        <button type="button" class="btn-x btn-primary-x" id="add-exam-btn">
          <i class="fa-solid fa-plus"></i> Yeni Deneme
        </button>
      </div>

      <!-- Deneme Tipi Seçimi -->
      <div class="exam-tabs glass">
        <button type="button" class="exam-tab active" data-type="tyt">
          <i class="fa-solid fa-book"></i>
          <span>TYT</span>
          <span class="tab-count" id="tyt-count">0</span>
        </button>
        <button type="button" class="exam-tab" data-type="ayt">
          <i class="fa-solid fa-graduation-cap"></i>
          <span>AYT</span>
          <span class="tab-count" id="ayt-count">0</span>
        </button>
        <button type="button" class="exam-tab" data-type="kpss">
          <i class="fa-solid fa-briefcase"></i>
          <span>KPSS</span>
          <span class="tab-count" id="kpss-count">0</span>
        </button>
      </div>

      <!-- İstatistik Kartları -->
      <div class="stats-grid" id="stats-grid"></div>

      <!-- Arama / Sıralama / Dışa aktarma -->
      <div class="exams-toolbar glass">
        <div class="input-icon toolbar-search">
          <input class="input" type="search" id="exam-search"
                 placeholder="Deneme adı veya not içinde ara" />
          <i class="fa-solid fa-magnifying-glass"></i>
        </div>

        <select class="select toolbar-sort" id="exam-sort" aria-label="Sıralama">
          <option value="date-desc">Tarih: yeniden eskiye</option>
          <option value="date-asc">Tarih: eskiden yeniye</option>
          <option value="net-desc">Net: yüksekten düşüğe</option>
          <option value="net-asc">Net: düşükten yükseğe</option>
        </select>

        <span class="toolbar-count" id="exam-result-label">—</span>

        <button type="button" class="btn-x btn-ghost-x" id="export-csv-btn"
                title="Bu sekmedeki denemeleri CSV olarak indir">
          <i class="fa-solid fa-file-csv"></i> CSV indir
        </button>
      </div>

      <!-- Deneme Listesi -->
      <div class="exams-list" id="exams-list"></div>

    </div>
  </div>

  <!-- Deneme Ekleme/Düzenleme Modal -->
  <div class="modal fade" id="exam-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modal-title">
            <i class="fa-solid fa-plus-circle"></i> Yeni Deneme Ekle
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button>
        </div>
        <div class="modal-body">
          <form id="exam-form" novalidate>
            
            <!-- Deneme Tipi -->
            <div class="field">
              <label for="exam-type">Deneme Tipi</label>
              <div class="input-icon">
                <select class="select" id="exam-type" required>
                  <option value="tyt">TYT (Temel Yeterlilik Testi)</option>
                  <option value="ayt">AYT (Alan Yeterlilik Testi)</option>
                  <option value="kpss">KPSS (Kamu Personeli Seçme Sınavı)</option>
                </select>
                <i class="fa-solid fa-list"></i>
              </div>
            </div>

            <!-- Deneme Adı ve Tarih -->
            <div class="grid-2">
              <div class="field">
                <label for="exam-name">Deneme Adı</label>
                <div class="input-icon">
                  <input class="input" type="text" id="exam-name" 
                         placeholder="örn: Acil Yayınları 5. Deneme" required />
                  <i class="fa-solid fa-file-lines"></i>
                </div>
              </div>

              <div class="field">
                <label for="exam-date">Deneme Tarihi</label>
                <div class="input-icon">
                  <input class="input" type="date" id="exam-date" required />
                  <i class="fa-solid fa-calendar"></i>
                </div>
              </div>
            </div>

            <!-- Ders Netler Bölümü (Dinamik) -->
            <div id="subjects-container"></div>

            <!-- Canlı toplam şeridi (exams.js doldurur) -->
            <div class="modal-totals" id="modal-totals"></div>

            <!-- Notlar -->
            <div class="field">
              <label for="exam-notes">Notlar (Opsiyonel)</label>
              <textarea class="textarea" id="exam-notes" rows="3"
                        placeholder="Denemeyle ilgili notlarınız..."></textarea>
            </div>

          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-x btn-ghost-x" data-bs-dismiss="modal">İptal</button>
          <button type="button" class="btn-x btn-primary-x" id="save-exam-btn">
            <i class="fa-solid fa-floppy-disk"></i> Kaydet
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Silme Onayı Modal -->
  <div class="modal fade" id="delete-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title">
            <i class="fa-solid fa-triangle-exclamation"></i> Denemeyi Sil
          </h5>
        </div>
        <div class="modal-body">
          <p class="muted mb-2">Bu deneme sonucu kalıcı olarak silinecek. Emin misin?</p>
          <p class="delete-target mb-0" id="delete-exam-name">—</p>
        </div>
        <div class="modal-footer border-0">
          <button type="button" class="btn-x btn-ghost-x" data-bs-dismiss="modal">Vazgeç</button>
          <button type="button" class="btn-x btn-danger-x" id="confirm-delete-btn">
            <i class="fa-solid fa-trash"></i> Sil
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bildirim alanı -->
  <div id="toast-area"></div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Exams JS -->
  <script src="exams.js"></script>
</body>
</html>
