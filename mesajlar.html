<!DOCTYPE html>
<html lang="tr" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mesajlar · Bay Porsuk</title>

  <!-- Poppins yazı tipi -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Font Awesome 6 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />

  <!-- Proje stilleri -->
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="admin.css" />
  <link rel="stylesheet" href="arkadaslar.css" />
  <link rel="stylesheet" href="mesajlar.css" />

  <!-- Yetki kontrolü -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="sb.js"></script>
  <script src="script.js"></script>
  <script>
    /* Oturum kontrolü hazır kapısında yapılır: Supabase oturumu
       asenkron geldiği için sayfa çizilir çizilmez bakılamaz.
       Karar verilene kadar sayfa gizli tutulur ki yetkisiz kullanıcı
       içeriği bir an bile görmesin. */
    document.documentElement.style.visibility = "hidden";
    window.YKS.hazir(function () {
      if (!window.YKS.Auth.isLoggedIn()) {
        window.location.replace("index.html");
        return;
      }
      document.documentElement.style.visibility = "";
    });
  </script>
</head>

<body>
  <canvas id="particle-canvas" aria-hidden="true"></canvas>

  <div class="chat-page">
    <div class="chat-container">

      <!-- ================================================
           ÜST BAR
           ================================================ -->
      <div class="chat-topbar glass">
        <button type="button" class="btn-x btn-ghost-x" id="back-btn">
          <i class="fa-solid fa-arrow-left"></i> Geri Dön
        </button>

        <div class="header-title">
          <i class="fa-solid fa-comments"></i>
          <div>
            <h1>Mesajlar</h1>
            <span class="header-sub" id="header-sub">Arkadaşlarınla birebir sohbet.</span>
          </div>
        </div>

        <div class="header-side">
          <a class="btn-x btn-ghost-x" href="arkadaslar.html">
            <i class="fa-solid fa-user-group"></i> Arkadaşlar
          </a>
        </div>
      </div>

      <!-- ================================================
           SOHBET DÜZENİ
           ================================================ -->
      <div class="chat-shell glass" id="chat-shell">

        <!-- Sol: sohbet listesi -->
        <aside class="chat-list-pane" id="list-pane">
          <div class="pane-head">
            <div class="input-icon">
              <input class="input" type="search" id="chat-search" placeholder="Sohbetlerde ara" />
              <i class="fa-solid fa-magnifying-glass"></i>
            </div>
          </div>
          <div class="chat-list" id="chat-list"></div>
        </aside>

        <!-- Sağ: seçili sohbet -->
        <section class="chat-thread-pane" id="thread-pane">

          <div class="thread-head" id="thread-head">
            <button type="button" class="thread-back" id="thread-back" aria-label="Sohbet listesine dön">
              <i class="fa-solid fa-chevron-left"></i>
            </button>
            <img class="thread-avatar" id="thread-avatar" alt="" />
            <div class="thread-id">
              <h3 id="thread-name">Sohbet seç</h3>
              <span id="thread-handle">Soldaki listeden bir arkadaşını seç</span>
            </div>
            <div class="thread-actions" id="thread-actions"></div>
          </div>

          <div class="thread-body" id="thread-body"></div>

          <div class="composer is-hidden" id="composer">
            <textarea class="composer-input" id="composer-input" rows="1"
                      placeholder="Mesajını yaz… (Enter gönderir, Shift+Enter alt satır)"
                      maxlength="2000"></textarea>
            <div class="composer-side">
              <span class="composer-count" id="composer-count">0/2000</span>
              <button type="button" class="composer-send" id="send-btn" aria-label="Gönder">
                <i class="fa-solid fa-paper-plane"></i>
              </button>
            </div>
          </div>

        </section>
      </div>

    </div>
  </div>

  <!-- Bildirim alanı -->
  <div id="toast-area"></div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Mesajlar JS -->
  <script src="mesajlar.js"></script>
</body>
</html>
