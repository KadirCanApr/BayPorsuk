<!DOCTYPE html>
<html lang="tr" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grafikler ve İstatistikler · Bay Porsuk</title>

  <!-- Poppins yazı tipi -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Font Awesome 6 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />

  <!-- Proje stilleri -->
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="admin.css" />
  <!-- Sekme çubuğu ve üst bar bileşenleri deneme modülüyle ortak -->
  <link rel="stylesheet" href="exams.css" />
  <link rel="stylesheet" href="istatistik.css" />

  <!-- Ortak çekirdek + müfredat kataloğu.
       Müfredat ilerleme bölümü konular.js olmadan hesaplanamaz. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="sb.js"></script>
  <script src="script.js"></script>
  <script src="konular.js"></script>
  <script>
    /* Oturum kontrolü hazır kapısında yapılır: Supabase oturumu
       asenkron geldiği için sayfa çizilir çizilmez bakılamaz.
       Karar verilene kadar sayfa gizli tutulur ki yetkisiz kullanıcı
       içeriği bir an bile görmesin. */
    document.documentElement.style.visibility = "hidden";
    window.YKS.hazir(function () {
      if (!window.YKS.Auth.isLoggedIn()) {
        window.location.replace("index.html");
        return;
      }
      document.documentElement.style.visibility = "";
    });
  </script>
</head>

<body>
  <canvas id="particle-canvas" aria-hidden="true"></canvas>

  <div class="stats-page">
    <div class="stats-container">

      <!-- ================================================
           ÜST BAR
           ================================================ -->
      <div class="stats-header glass">
        <button type="button" class="btn-x btn-ghost-x" id="back-btn">
          <i class="fa-solid fa-arrow-left"></i> Geri Dön
        </button>

        <div class="header-title">
          <i class="fa-solid fa-chart-pie"></i>
          <div>
            <h1>Grafikler ve İstatistikler</h1>
            <span class="header-sub" id="header-sub">Tüm modüllerden gelen verinin tek ekranda özeti.</span>
          </div>
        </div>

        <div class="header-side">
          <button type="button" class="btn-x btn-ghost-x" id="export-btn"
                  title="Görünen özeti CSV olarak indir">
            <i class="fa-solid fa-file-csv"></i> CSV indir
          </button>
          <button type="button" class="btn-x btn-primary-x" id="print-btn"
                  title="Raporu yazdır veya PDF olarak kaydet">
            <i class="fa-solid fa-print"></i> Rapor al
          </button>
        </div>
      </div>

      <!-- ================================================
           ARAÇ ÇUBUĞU — zaman aralığı ve sınav türü
           ================================================ -->
      <div class="stats-toolbar glass">
        <div class="toolbar-group">
          <label for="range-select">Zaman aralığı</label>
          <select class="select" id="range-select">
            <option value="7">Son 7 gün</option>
            <option value="30" selected>Son 30 gün</option>
            <option value="90">Son 90 gün</option>
            <option value="180">Son 6 ay</option>
            <option value="365">Son 1 yıl</option>
            <option value="all">Tüm zamanlar</option>
          </select>
        </div>

        <div class="toolbar-group">
          <label for="type-select">Sınav türü</label>
          <select class="select" id="type-select">
            <option value="tyt" selected>TYT</option>
            <option value="ayt">AYT</option>
            <option value="kpss">KPSS</option>
          </select>
        </div>

        <div class="toolbar-range" id="range-info">—</div>
      </div>

      <!-- ================================================
           BÖLÜM SEKMELERİ
           ================================================ -->
      <div class="exam-tabs glass" id="section-tabs">
        <button type="button" class="exam-tab active" data-section="genel">
          <i class="fa-solid fa-gauge-high"></i>
          <span>Genel Bakış</span>
        </button>
        <button type="button" class="exam-tab" data-section="calisma">
          <i class="fa-solid fa-stopwatch"></i>
          <span>Çalışma</span>
        </button>
        <button type="button" class="exam-tab" data-section="deneme">
          <i class="fa-solid fa-clipboard-list"></i>
          <span>Denemeler</span>
        </button>
        <button type="button" class="exam-tab" data-section="mufredat">
          <i class="fa-solid fa-book-open"></i>
          <span>Müfredat</span>
        </button>
        <button type="button" class="exam-tab" data-section="hedef">
          <i class="fa-solid fa-bullseye"></i>
          <span>Hedefler</span>
        </button>
        <button type="button" class="exam-tab" data-section="gunluk">
          <i class="fa-solid fa-feather-pointed"></i>
          <span>Günlük</span>
        </button>
      </div>

      <!-- ================================================
           İÇERİK — istatistik.js doldurur
           ================================================ -->
      <div id="stats-content"></div>

    </div>
  </div>

  <!-- Grafik üzerinde gezinirken çıkan bilgi balonu -->
  <div id="chart-tip" class="chart-tip" aria-hidden="true"></div>

  <!-- Bildirim alanı -->
  <div id="toast-area"></div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- İstatistik JS -->
  <script src="istatistik.js"></script>
</body>
</html>
