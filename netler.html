<!DOCTYPE html>
<html lang="tr" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TYT / AYT Netleri · Bay Porsuk</title>

  <!-- Poppins yazı tipi -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Font Awesome 6 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />

  <!-- Proje stilleri -->
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="admin.css" />
  <!-- Sekme çubuğu ve üst bar bileşenleri deneme modülüyle ortak -->
  <link rel="stylesheet" href="exams.css" />
  <link rel="stylesheet" href="netler.css" />

  <!-- Yetki kontrolü -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="sb.js"></script>
  <script src="script.js"></script>
  <script>
    /* Oturum kontrolü hazır kapısında yapılır: Supabase oturumu
       asenkron geldiği için sayfa çizilir çizilmez bakılamaz.
       Karar verilene kadar sayfa gizli tutulur ki yetkisiz kullanıcı
       içeriği bir an bile görmesin. */
    document.documentElement.style.visibility = "hidden";
    window.YKS.hazir(function () {
      if (!window.YKS.Auth.isLoggedIn()) {
        window.location.replace("index.html");
        return;
      }
      document.documentElement.style.visibility = "";
    });
  </script>
</head>

<body>
  <canvas id="particle-canvas" aria-hidden="true"></canvas>

  <div class="nets-page">
    <div class="nets-container">

      <!-- ================================================
           ÜST BAR
           ================================================ -->
      <div class="nets-header glass">
        <button type="button" class="btn-x btn-ghost-x" id="back-btn">
          <i class="fa-solid fa-arrow-left"></i> Geri Dön
        </button>

        <div class="header-title">
          <i class="fa-solid fa-chart-simple"></i>
          <div>
            <h1>TYT / AYT Netleri</h1>
            <span class="header-sub" id="header-sub">Denemelerinden gelen ders ders net dökümü.</span>
          </div>
        </div>

        <div class="header-side">
          <a class="btn-x btn-ghost-x" href="progress.html">
            <i class="fa-solid fa-chart-line"></i> Gelişim
          </a>
          <a class="btn-x btn-primary-x" href="exams.html">
            <i class="fa-solid fa-clipboard-list"></i> Denemeler
          </a>
        </div>
      </div>

      <!-- ================================================
           SINAV TÜRÜ SEKMELERİ
           ================================================ -->
      <div class="exam-tabs glass" id="type-tabs">
        <button type="button" class="exam-tab active" data-type="tyt">
          <i class="fa-solid fa-book"></i>
          <span>TYT</span>
          <span class="tab-count" data-count="tyt">0</span>
        </button>
        <button type="button" class="exam-tab" data-type="ayt">
          <i class="fa-solid fa-graduation-cap"></i>
          <span>AYT</span>
          <span class="tab-count" data-count="ayt">0</span>
        </button>
        <button type="button" class="exam-tab" data-type="kpss">
          <i class="fa-solid fa-briefcase"></i>
          <span>KPSS</span>
          <span class="tab-count" data-count="kpss">0</span>
        </button>
      </div>

      <!-- ================================================
           İSTATİSTİK KARTLARI
           ================================================ -->
      <div class="net-stats" id="net-stats"></div>

      <!-- ================================================
           ARAÇ ÇUBUĞU
           ================================================ -->
      <div class="nets-toolbar glass">
        <div class="input-icon toolbar-search">
          <input class="input" type="search" id="net-search" placeholder="Deneme adında ara" />
          <i class="fa-solid fa-magnifying-glass"></i>
        </div>

        <select class="select toolbar-select" id="range-select" aria-label="Aralık">
          <option value="all">Tüm denemeler</option>
          <option value="10">Son 10 deneme</option>
          <option value="5">Son 5 deneme</option>
        </select>

        <select class="select toolbar-select" id="sort-select" aria-label="Sıralama">
          <option value="date-desc">Tarih: yeniden eskiye</option>
          <option value="date-asc">Tarih: eskiden yeniye</option>
          <option value="net-desc">Net: yüksekten düşüğe</option>
          <option value="net-asc">Net: düşükten yükseğe</option>
        </select>

        <span class="toolbar-count" id="result-label">—</span>

        <button type="button" class="btn-x btn-ghost-x" id="export-csv-btn"
                title="Bu sekmedeki netleri CSV olarak indir">
          <i class="fa-solid fa-file-csv"></i> CSV indir
        </button>
      </div>

      <!-- ================================================
           İÇERİK — netler.js doldurur
           ================================================ -->
      <div id="nets-content"></div>

    </div>
  </div>

  <!-- Bildirim alanı -->
  <div id="toast-area"></div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Netler JS -->
  <script src="netler.js"></script>
</body>
</html>
